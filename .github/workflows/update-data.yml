name: Update Data

# 项目已停止维护：官方站点停止更新，自动拉取已关闭。
# 仅保留手动触发，供有需要时一次性抓取使用。
on:
  workflow_dispatch:  # 仅允许手动触发

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        run: python src/scraper.py --no-download

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scraped_articles.json
          git diff --staged --quiet || git commit -m "chore: Update scraped articles data"
          git push

      - name: Trigger static deployment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run static.yml
